<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beach Patrol – 3D Trash Cleanup</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--panel:#fff6e3;--ink:#0b3a4a;--coral:#ff6b4a;--line:#0b3a4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#12303c;--ink:#ffeccc;--line:#ffeccc}}
:root[data-theme="dark"]{--panel:#12303c;--ink:#ffeccc;--line:#ffeccc}
html,body{height:100%;margin:0;background:#8fd6e0;font-family:'Lilita One',system-ui,sans-serif;color:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#c.hot{cursor:pointer}
.hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;flex-wrap:wrap;justify-content:space-between;padding:10px;pointer-events:none;gap:8px}
.box{background:var(--panel);border:3px solid var(--line);border-radius:14px 14px 14px 4px;padding:5px 12px;box-shadow:3px 3px 0 var(--line);font-size:24px;line-height:1}
.box small{display:block;font-size:12px;opacity:.7;margin-bottom:2px}
.slots{display:flex;gap:4px;margin-top:3px}
.slots i{width:16px;height:16px;border:3px solid var(--line);border-radius:5px}
.slots i.f{background:var(--coral)}
.tools{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(40px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.tb{font-size:18px;padding:6px 14px;margin:0;background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--line);cursor:pointer;font-family:inherit}
.tb.on{background:var(--coral);color:#fff}
.tide{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:14px;border:3px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;pointer-events:none}
#tb{height:100%;width:100%;background:var(--coral);transform-origin:left}
#hint{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));text-align:center;font-size:16px;pointer-events:none;text-shadow:0 1px 0 var(--panel),0 0 6px var(--panel)}
#toast{position:fixed;left:50%;top:32%;transform:translateX(-50%);font-size:32px;color:#fff;-webkit-text-stroke:2px #0b3a4a;paint-order:stroke fill;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-16px)}
#prog{position:fixed;width:70px;height:12px;border:3px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden;display:none;pointer-events:none;transform:translate(-35px,-44px)}
#pf{height:100%;width:0;background:#2b8fd6}
#xh{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #0b3a4a;pointer-events:none}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(11,58,74,.55);padding:14px}
.card{background:var(--panel);border:4px solid var(--line);border-radius:26px 26px 26px 6px;padding:20px 22px;max-width:560px;max-height:92vh;overflow:auto;box-shadow:8px 8px 0 var(--line)}
.card h1{margin:0 0 6px;font-size:40px;line-height:1;font-weight:400}
.card p{margin:6px 0;font-size:16px;line-height:1.35;font-family:system-ui,sans-serif;font-weight:600}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.lv{font:inherit;text-align:left;background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:14px;padding:0 0 8px;cursor:pointer;box-shadow:3px 3px 0 var(--line);overflow:hidden;margin:0;font-size:16px}
.lv .st{height:34px;display:block;margin-bottom:6px}
.lv b,.lv span,.lv small,.lv em{display:block;padding:0 10px;font-style:normal;font-weight:400}
.lv b{font-size:20px}.lv small{font-size:13px;opacity:.75;font-family:system-ui,sans-serif}.lv em{color:var(--coral);font-size:18px}
button.act{font:inherit;font-size:22px;background:var(--coral);color:#fff;border:3px solid var(--line);border-radius:14px;padding:7px 22px;margin:8px 8px 0 0;cursor:pointer;box-shadow:4px 4px 0 var(--line)}
button:active{transform:translate(2px,2px)}
.gearbtn{position:fixed;z-index:3;right:12px;bottom:calc(52px + env(safe-area-inset-bottom,0px));font-size:26px;line-height:1;padding:6px 10px;background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:12px;box-shadow:3px 3px 0 var(--line);cursor:pointer}
#set{position:fixed;z-index:4;inset:0;align-items:center;justify-content:center;background:rgba(11,58,74,.6);padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0;font-family:system-ui,sans-serif;font-weight:600;font-size:16px}
.row .tb{min-width:120px;margin:0}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="box"><small>Score</small><span id="sc">0</span></div>
  <div class="box"><small>Left</small><span id="left">0</span></div>
  <div class="box"><small>Bag</small><div class="slots" id="slots"></div></div>
  <div class="box"><small>Time</small><span id="tm">90</span></div>
</div>
<div id="hint"></div>
<div class="tools">
  <button class="tb on" data-t="hand">1 Hand</button>
  <button class="tb" data-t="hose">2 Hose</button>
  <button class="tb" data-t="brush">3 Brush</button>
</div>
<div class="tide"><div id="tb"></div></div>
<div id="toast"></div>
<div id="xh"></div>
<div id="prog"><div id="pf"></div></div>
<div id="ov"><div class="card">
  <h1 id="ttl">Beach Patrol</h1>
  <p id="msg"></p>
  <div id="grid"></div>
  <div id="btns"></div>
</div></div>

<button id="gear" class="gearbtn" aria-label="Settings" title="Settings">⚙</button>
<div id="set" style="display:none"><div class="card">
  <h1>Settings</h1>
  <p>Click a key, then press the new key. Esc cancels.</p>
  <div id="keys"></div>
  <div class="row"><label for="sens">Look speed</label><input id="sens" type="range" min=".3" max="3" step=".1"></div>
  <div class="row"><label for="inv">Invert vertical look</label><input id="inv" type="checkbox"></div>
  <button class="act" id="resume">Resume</button><button class="act" id="reset">Reset controls</button><button class="act" id="leave">Leave level</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>

const FN={

  g.position.set(x,0,z);W(g);obst.push({x,z,r:.8});},

function sign(txt,w,h,pw,ph,col,font,bg){const c=document.createElement('canvas');c.width=pw;c.height=ph;const x=c.getContext('2d');if(bg){x.fillStyle=bg;x.fillRect(0,0,pw,ph);}x.fillStyle=col;x.textAlign='center';x.textBaseline='middle';x.font=font;const ls=txt.split('|');ls.forEach((s,i)=>x.fillText(s,pw/2,ph*(i+.5)/ls.length));return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}));}

const bx=(w,h,d,c,x,y,z,s)=>{const m=mesh(new THREE.BoxGeometry(w,h,d),c,x,y,z,s);W(m);return m;};
const ob=(x,z,r)=>obst.push({x,z,r});
const ROOMS={
 hall(){const z0=RECT.z0;
  bx(34,6,.2,0x6b6f78,0,3,z0+.15);for(let i=-16;i<=16;i+=2)bx(.08,6,.1,0x555962,i,3,z0+.3);

    {const h=pick();hover=h.it||null;}

      const need=hover.kind==='mud'?'hose':'brush';

    if(o.kind==='litter'){o.g.position.y=.95+Math.sin(t*2+o.ph)*.12;o.m.rotation.y+=dt;}
    const hv=o===hover;if(o.kind==='litter')o.m.scale.setScalar(hv?1.5:1);o.m.material.emissive.setHex(hv?0x555555:0);
  }
  for(let i=flying.length-1;i>=0;i--){const f=flying[i];f.t+=dt/.35;if(f.t>=1){scene.remove(f.m);flying.splice(i,1);continue;}tmp.set(P.x,1.8,P.z);f.m.position.lerpVectors(f.from,tmp,f.t);f.m.position.y+=Math.sin(f.t*Math.PI)*1.5;f.m.scale.setScalar(1-f.t*.5);}
  binRing.material.opacity=.5+Math.sin(t*4)*.3;
  rangeRing.visible=rangeFill.visible=cursor.visible=running;
  rangeRing.position.set(P.x,.24,P.z);rangeFill.position.set(P.x,.2,P.z);cursor.position.set(cur.x,.3,cur.z);cursor.scale.setScalar(hover?1.25+Math.sin(t*8)*.08:1);

  if(hoseOn){const a=new THREE.Vector3(P.x+Math.cos(P.yaw)*.45,1.25,P.z-Math.sin(P.yaw)*.45),b=new THREE.Vector3(cur.x,.2,cur.z),dir=b.clone().sub(a),len=dir.length();hoseFx.position.copy(a).add(b).multiplyScalar(.5);hoseFx.scale.set(1+Math.sin(t*40)*.3,len,1+Math.sin(t*40)*.3);hoseFx.quaternion.setFromUnitVectors(Y,dir.normalize());}
